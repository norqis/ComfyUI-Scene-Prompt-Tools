name: Apply review P1 fix

on:
  push:
    branches: [fix/issues-36-39]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issues-36-39
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'Pillow<12' 'coverage<8'
      - run: python tools/apply_review_p1.py
      - run: python -m compileall -q scene_prompt_tools tests __init__.py
      - run: python -m unittest discover -s tests -p 'test_issue_regressions.py' -v
      - run: python -m unittest discover -s tests -v
      - name: Commit review fix
        shell: bash
        run: |
          rm -f tools/apply_review_p1.py .github/workflows/apply-review-p1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: refresh normalized preset hash'
          git push origin HEAD:fix/issues-36-39
