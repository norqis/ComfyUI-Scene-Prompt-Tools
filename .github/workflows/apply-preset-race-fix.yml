name: Apply preset list race fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issues-36-39'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tools/fix_preset_force_race.py
      - run: |
          npm run check:frontend
          npm run test:frontend
      - name: Commit fix
        shell: bash
        run: |
          rm -f tools/fix_preset_force_race.py .github/workflows/apply-preset-race-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve explicit preset refresh race handling'
          git push origin HEAD:${{ github.head_ref }}
