name: Apply open issue fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issues-36-39'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'Pillow<12' 'coverage<8'
      - name: Apply fixes
        run: python tools/apply_open_issue_fixes.py
      - name: Validate Python
        run: |
          python -m compileall -q scene_prompt_tools tests __init__.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - name: Validate frontend
        run: |
          npm run check:frontend
          node tests/test_scene_prompt_selection_normalization.cjs
          node tests/test_scene_prompt_state.mjs
      - name: Commit fixes
        shell: bash
        run: |
          rm -f tools/apply_open_issue_fixes.py .github/workflows/apply-open-issue-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: resolve open scene prompt issues'
          git push origin HEAD:${{ github.head_ref }}
